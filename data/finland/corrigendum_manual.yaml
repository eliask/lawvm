# Base source XML label defect.
# 91/1982 (Maa-ainesasetus) — first section is encoded as sec_131 / 131 § in
# the enacted SD source XML even though the consolidated Finlex witness and the
# legal sequence identify it as 1 §. The exact full-section fragment patch keeps
# the correction bounded and repairs both visible <num> and eId lineage.
