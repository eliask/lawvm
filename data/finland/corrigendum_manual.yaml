  wrong_text: |-
    <section eId="sec_131">
                        <num>131 §</num>
                        <subsection eId="sec_131__subsec_1">
                            <intro eId="sec_131__subsec_1__intro">
                                <p>Maa-aineslain 2 §:n 1 momentin 2 kohdassa tarkoitettuna lupana tai suunnitelmana pidetään:</p>
                            </intro>
                            <paragraph eId="sec_131__subsec_1__para_1">
                                <num>1)</num>
                                <content>
                                    <p>rakennuslupaa;</p>
                                </content>
                            </paragraph>
                            <paragraph eId="sec_131__subsec_1__para_2">
                                <num>2)</num>
                                <content>
                                    <p>yleisistä teistä annetussa laissa (243/54) tarkoitettua tiesuunnitelmaa;</p>
