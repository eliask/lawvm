                                <num>3)</num>
                                <content>
                                    <p>yksityisistä teistä annetussa laissa (358/ 62) tarkoitetussa tietoimituksessa annettua päätöstä;</p>
                                </content>
                            </paragraph>
                            <paragraph eId="sec_131__subsec_1__para_4">
                                <num>4)</num>
                                <content>
                                    <p>kiinteän omaisuuden ja erityisten oikeuksien lunastuksesta annetussa laissa (603/77) tarkoitettua lunastuslupaa;</p>
                                </content>
                            </paragraph>
                            <paragraph eId="sec_131__subsec_1__para_5">
                                <num>5)</num>
                                <content>
                                    <p>ilmailulaissa (595/64) tarkoitettua lupaa yleisen tai yksityisen lentopaikan rakentamiseen ja pitoon;</p>
                                </content>
                            </paragraph>
                            <paragraph eId="sec_131__subsec_1__para_6">
                                <num>6)</num>
                                <content>
                                    <p>vesilaissa (264/61) tarkoitettua lupaa vesistöön rakentamiseen; sekä</p>
                                </content>
                            </paragraph>
                            <paragraph eId="sec_131__subsec_1__para_7">
                                <num>7)</num>
                                <content>
                                    <p>muuta näihin verrattavaa lupaa tai suunnitelmaa.</p>
                                </content>
                            </paragraph>
                        </subsection>
                    </section>
  correct_text: |-
