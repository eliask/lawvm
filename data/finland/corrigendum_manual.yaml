# Deprecated. Migrated 2026-06-28 to two typed carriers.
#
# This file's content was moved out (mechanical byte-faithful migration via
# scripts/migrations/split_corrigendum_manual.py) because it conflated two
# distinct proof problems that the runtime must keep type-distinct:
#
#   (a) Upstream-corrigenda extraction retries — an upstream Finlex
#       corrigendum PDF exists (sha256'd in corrigendum_sources_fi.jsonl,
#       classified in corrigendum_official_fi.jsonl); the LLM/regex/vision
#       extractors produced a (wrong_text, correct_text) that does not
#       byte-match in source XML. The retry overlay carries byte-exact
#       patches that realise the same upstream-corrigendum effect.
#
#       Carrier: data/finland/corrigendum_retry_overlays_fi.jsonl
#       Loader: lawvm.finland.corrigendum._load_retry_overlays()
#       Granularity: per-stable_id overlay on corrigendum_official_fi.jsonl
#       Authority witness: the upstream Finlex corrigendum PDF.
#
#   (c) LawVM-authored source-defect patches — NO upstream Finlex
#       corrigendum exists; the base source XML itself is defective (OCR,
#       glued § token, line-end hyphenation, wrong section eId). LawVM
#       authored a repair with a typed source_witness that is NOT the
#       consolidated Finlex oracle as truth.
#
#       Carrier: data/finland/source_defect_fixes_fi.yaml
#       Loader: lawvm.finland.corrigendum.CorrigendumPatchTable.load_from_source()
#       Granularity: per (amendment_id, correction_type, wrong_text) tuple
#       Authority witness: typed source_witness.kind per family (step 4).
#
# Why the split:
#   - The "first manual entry REPLACES all DB-derived patches for
#     amendment_id" semantics silently wiped legitimate sibling patches
#     in the same amendment when any retry landed (AGENTS.md §0 Mutation
#     Boundary, §1.8 conservation). The per-stable_id overlay on (a)
#     replaces only the targeted official row, never wiping siblings.
#   - Free-text discriminator "no_official_corrigendum_found" in the
#     `notes` field was the only signal separating these two phenomena
#     (a) from (c). Splitting the carriers makes the distinction
#     structural and a future typed carrier can add rule_id / family /
#     source_witness fields with §2.1 discipline.
#   - Source-defect patches have no upstream corrigendum, so citing
#     the consolidated Finlex oracle as their authority is the §2.10
#     plane-collapse smell step 5 closes.
#
# Migration reference: scripts/migrations/split_corrigendum_manual.py
# Spec: notes/manual_claims/MANUAL_COMPILATION_CLAIMS.md
# Operating contract: AGENTS.md §0 + §2.10
#
# This file is intentionally empty of entries. Treat any future patch as
# belonging in source_defect_fixes_fi.yaml (source-defect) or
# corrigendum_retry_overlays_fi.jsonl (upstream-corrigenda retry), not here.