# LawVM-authored source-defect patches (no upstream corrigendum).
#
# Each entry repairs a defect in the BASE source XML itself — OCR
# substitutions, glued tokens, line-end hyphenation, wrong section
# eIds — where NO official Finlex corrigendum exists. The witness
# for each is a typed source_witness (kind: typographic_impossibility |
# ordinal_structure | multi_acquisition_corroboration |
# finlex_publication_backfill); the consolidated Finlex oracle is NEVER
# used as truth where an intrinsic witness is defensible — that is the
# AGENTS.md §2.10 plane-collapse smell this typed carrier closes.
#
# This file REPLACES legacy corrigendum_manual.yaml for source-defect
# patches. Upstream-corrigenda extraction retries live in
# corrigendum_retry_overlays_fi.jsonl as per-stable_id overlays.
# See notes/manual_claims/MANUAL_COMPILATION_CLAIMS.md and
# AGENTS.md §0 (no silent mutation) / §2.1 (rule family ownership) /
# §2.10 (planes stay type-distinct).
#
# Schema:
#   - amendment_id: "NUM/YEAR"        (e.g. 41/1965)
#     rule_id:    FINLAND.SOURCE_DEFECT.* stable identifier
#     family:     presentation_cleanup | source_pathology_ocr |
#                 structural_label_mislabel | table_completeness |
#                 source_pathology       (label only — AGENTS §2.1)
#     source_witness:
#       kind: typographic_impossibility | ordinal_structure |
#            multi_acquisition_corroboration |
#            finlex_publication_backfill
#       detail: <family-specific reason summary>
#       corroborators: [<locator>, ...]   # only for corroboration kinds
#     wrong_text:    exact bytes in source XML
#     correct_text:  corrected bytes
#     correction_type: johtolause | body_text   (routing flag)
#     expected_apply_count: N        # default 1; ≥1 expected byte-spans
#     notes:                          human-readable explanation
#     verified: "YYYY-MM-DD"

